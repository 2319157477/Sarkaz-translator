<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>JSON 数据清洗工具</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
h1 { text-align: center; margin-bottom: 20px; color: #a0c4ff; font-size: 1.4em; }
.toolbar {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  margin-bottom: 16px; padding: 12px; background: #16213e; border-radius: 8px;
}
.toolbar button, .toolbar label {
  padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer;
  font-size: 14px; color: #fff;
}
.toolbar label { background: #0f3460; }
.toolbar label:hover { background: #1a4a7a; }
#fileInput { display: none; }
#btnDeleteSelected { background: #e74c3c; }
#btnDeleteSelected:hover { background: #c0392b; }
#btnSave { background: #27ae60; }
#btnSave:hover { background: #1e8449; }
#btnSelectAll { background: #2980b9; }
#btnSelectAll:hover { background: #1f6da0; }
#btnInvert { background: #8e44ad; }
#btnInvert:hover { background: #6c3483; }
.stats { margin-left: auto; font-size: 13px; color: #a0a0a0; }
.search { padding: 8px 12px; border-radius: 6px; border: 1px solid #333; background: #0f3460; color: #fff; width: 200px; }
.search::placeholder { color: #666; }
#entries { display: flex; flex-direction: column; gap: 4px; }
.entry {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; background: #16213e; border-radius: 6px;
  border: 1px solid transparent; transition: background 0.15s;
}
.entry:hover { background: #1a2744; }
.entry.selected { border-color: #e74c3c; background: #2a1a1a; }
.entry input[type="checkbox"] { flex-shrink: 0; width: 18px; height: 18px; cursor: pointer; }
.entry .key { color: #a0c4ff; font-weight: 600; min-width: 120px; word-break: break-all; }
.entry .val { color: #ccc; flex: 1; word-break: break-all; font-size: 13px; }
.entry .val.obj { color: #888; font-style: italic; }
.empty { text-align: center; padding: 60px; color: #555; font-size: 1.1em; }
.hidden { display: none !important; }
</style>
</head>
<body>
<h1>JSON 数据清洗工具</h1>
<div class="toolbar">
  <label for="fileInput">打开 JSON</label>
  <input type="file" id="fileInput" accept=".json">
  <input type="text" class="search" id="search" placeholder="搜索键或值...">
  <button id="btnSelectAll">全选</button>
  <button id="btnInvert">反选</button>
  <button id="btnDeleteSelected">删除选中</button>
  <button id="btnSave">保存 JSON</button>
  <span class="stats" id="stats"></span>
</div>
<div id="entries"><div class="empty">点击「打开 JSON」加载文件</div></div>
<script>
let data = null;
let fileName = '';
let isArray = false;

const entriesEl = document.getElementById('entries');
const statsEl = document.getElementById('stats');
const searchEl = document.getElementById('search');

document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  fileName = file.name;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      data = JSON.parse(ev.target.result);
      isArray = Array.isArray(data);
      render();
    } catch (err) {
      alert('JSON 解析失败: ' + err.message);
    }
  };
  reader.readAsText(file, 'utf-8');
});

function render() {
  const query = searchEl.value.toLowerCase();
  entriesEl.innerHTML = '';
  const entries = isArray
    ? data.map((v, i) => [String(i), v])
    : Object.entries(data);

  let shown = 0;
  entries.forEach(([k, v]) => {
    const valStr = typeof v === 'object' ? JSON.stringify(v, null, 0) : String(v);
    if (query && !k.toLowerCase().includes(query) && !valStr.toLowerCase().includes(query)) return;
    shown++;
    const div = document.createElement('div');
    div.className = 'entry';
    div.dataset.key = k;
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.addEventListener('change', () => div.classList.toggle('selected', cb.checked));
    const keySpan = document.createElement('span');
    keySpan.className = 'key';
    keySpan.textContent = k;
    const valSpan = document.createElement('span');
    valSpan.className = 'val' + (typeof v === 'object' ? ' obj' : '');
    valSpan.textContent = valStr.length > 300 ? valStr.slice(0, 300) + '...' : valStr;
    div.append(cb, keySpan, valSpan);
    entriesEl.appendChild(div);
  });
  statsEl.textContent = `共 ${entries.length} 条` + (query ? ` / 显示 ${shown} 条` : '') + ` | ${fileName}`;
}

searchEl.addEventListener('input', render);

document.getElementById('btnSelectAll').addEventListener('click', () => {
  entriesEl.querySelectorAll('.entry:not(.hidden) input[type="checkbox"]').forEach(cb => {
    cb.checked = true;
    cb.closest('.entry').classList.add('selected');
  });
});

document.getElementById('btnInvert').addEventListener('click', () => {
  entriesEl.querySelectorAll('.entry:not(.hidden) input[type="checkbox"]').forEach(cb => {
    cb.checked = !cb.checked;
    cb.closest('.entry').classList.toggle('selected', cb.checked);
  });
});

document.getElementById('btnDeleteSelected').addEventListener('click', () => {
  const selected = entriesEl.querySelectorAll('.entry.selected');
  if (!selected.length) return;
  if (!confirm(`确认删除 ${selected.length} 条？`)) return;
  const keys = [...selected].map(el => el.dataset.key);
  if (isArray) {
    const indices = keys.map(Number).sort((a, b) => b - a);
    indices.forEach(i => data.splice(i, 1));
  } else {
    keys.forEach(k => delete data[k]);
  }
  render();
});

document.getElementById('btnSave').addEventListener('click', () => {
  if (!data) return;
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fileName || 'cleaned.json';
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>
</body>
</html>
